<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S Protocol - น้องพิธี AI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary-cyan: #00d2ff;
      --bg-dark: #070f14;
      --panel-bg: rgba(7, 15, 20, 0.85);
    }
    
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at center, #112d40 0%, var(--bg-dark) 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* สแกนเส้นเอฟเฟกต์เหมือนจอคอมยุคอวกาศ */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(0, 210, 255, 0.03) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px; pointer-events: none; z-index: 9999; opacity: 0.4;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.6) !important;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
    }
    
    .chat-container {
      flex: 1; overflow-y: auto; padding: 20px; margin-bottom: 160px;
      scrollbar-width: thin; scrollbar-color: var(--primary-cyan) transparent;
    }
    
    .message {
      max-width: 85%; margin-bottom: 15px; padding: 15px 20px;
      border-radius: 12px; line-height: 1.6; font-size: 1rem;
      animation: fadeIn 0.4s ease forwards;
      border: 1px solid transparent;
    }
    
    .msg-user {
      background-color: rgba(0, 210, 255, 0.1);
      color: var(--primary-cyan); margin-left: auto;
      border-right: 3px solid var(--primary-cyan);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
    }
    
    .msg-bot {
      background-color: rgba(255, 255, 255, 0.05);
      color: #e0e0e0; margin-right: auto;
      border-left: 3px solid #00ff88;
      backdrop-filter: blur(5px);
    }
    
    /* J.A.R.V.I.S Arc Reactor Mic */
    .jarvis-core-wrapper {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 100;
    }

    .jarvis-core {
      position: relative; width: 90px; height: 90px;
      display: flex; justify-content: center; align-items: center;
    }

    /* วงแหวนหมุนรอบปุ่ม */
    .jarvis-ring {
      position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 2px solid transparent;
      border-top-color: var(--primary-cyan);
      border-bottom-color: rgba(0, 210, 255, 0.3);
      animation: spin 4s linear infinite;
    }
    .jarvis-ring.listening {
      border-top-color: #ff0055; border-bottom-color: #ff0055;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px #ff0055;
    }

    .mic-btn {
      width: 70px; height: 70px; border-radius: 50%;
      background: radial-gradient(circle, #005a75, #001a24);
      border: 2px solid var(--primary-cyan);
      color: var(--primary-cyan); font-size: 26px; z-index: 2;
      box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.8), 0 0 20px rgba(0, 210, 255, 0.5);
      transition: all 0.3s;
    }
    .mic-btn.listening {
      background: radial-gradient(circle, #750027, #24000b);
      border-color: #ff0055; color: #ff0055;
      box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.8), 0 0 20px rgba(255, 0, 85, 0.5);
    }
    
    .token-counter {
      font-size: 0.8rem; letter-spacing: 1px; color: var(--primary-cyan);
      background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 20px;
      border: 1px solid var(--primary-cyan); margin-top: 10px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Admin Panel */
    .admin-panel {
      display: none; background: var(--bg-dark); position: absolute;
      top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; overflow-y: auto; padding: 20px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 10px; color: #fff;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold text-info" style="letter-spacing: 2px;" href="#">
        <i class="fa-solid fa-satellite-dish me-2"></i> SYS: NONG-PITI
      </a>
      <button class="btn btn-outline-info btn-sm" onclick="promptAdmin()">
        <i class="fa-solid fa-terminal"></i> DIRECTIVE OVERRIDE
      </button>
    </div>
  </nav>

  <div class="container chat-container" id="chatBox">
    <div class="message msg-bot">
      <b><i class="fa-solid fa-microchip text-success"></i> ระบบเริ่มทำงาน:</b><br>
      สวัสดีครับ ผมน้องพิธี ผู้ช่วยอัจฉริยะกลุ่มพิธีการศพที่ได้รับพระราชทาน<br>
      สถานะระบบ: <span class="text-info">ออนไลน์พร้อมรับคำสั่ง</span><br>
      (จำกัดการโต้ตอบด้วยเสียง 10 ครั้งต่อรอบการใช้งาน)
    </div>
  </div>

  <div class="jarvis-core-wrapper">
    <div class="jarvis-core">
      <div class="jarvis-ring" id="micRing"></div>
      <button class="mic-btn" id="micBtn" onclick="toggleSpeech()">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>
    <div class="text-center mt-2 fw-bold text-info small" id="statusText" style="letter-spacing: 1px;">AWAITING COMMAND</div>
    <div class="token-counter" id="tokenDisplay">COUNCIL TOKENS: 0/10</div>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-info pb-2">
        <h4 class="mb-0 text-info fw-bold"><i class="fa-solid fa-network-wired"></i> KNOWLEDGE BASE UPLINK</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="closeAdmin()">DISCONNECT</button>
      </div>

      <div class="card glass-card shadow-sm mb-4">
        <div class="card-body">
          <input type="hidden" id="editId">
          <div class="mb-2">
            <label class="form-label fw-bold text-info">หมวดหมู่ / คีย์เวิร์ด (DATA NODE)</label>
            <input type="text" class="form-control bg-dark text-white border-info" id="txtKeywords" placeholder="เช่น การขอพระราชทานเพลิง">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold text-info">ชุดข้อมูลความรู้ (DATA PAYLOAD)</label>
            <textarea class="form-control bg-dark text-white border-info" id="txtAnswer" rows="4" placeholder="พิมพ์รายละเอียดข้อมูลที่ถูกต้อง..."></textarea>
          </div>
          <button class="btn btn-info fw-bold text-dark" onclick="saveData()"><i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD DATA</button>
          <button class="btn btn-outline-light" onclick="clearForm()">CLEAR</button>
        </div>
      </div>

      <div class="table-responsive glass-card p-3">
        <table class="table table-dark table-hover table-borderless">
          <thead style="border-bottom: 2px solid #00d2ff;">
            <tr>
              <th width="30%" class="text-info">NODE</th>
              <th width="50%" class="text-info">PAYLOAD</th>
              <th width="20%" class="text-info">ACTION</th>
            </tr>
          </thead>
          <tbody id="tbData"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // อัปเดต URL เรียบร้อยตามคำขอ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwtYM6DYZX5Ie0t7z4X5iOLAM-bu9Iuf0qJ-RN94BTA3DDW6Xmbz0AOegCrmDRzVkFegw/exec"; 

    // --- Token System ---
    let questionCount = 0;
    const MAX_QUESTIONS = 10;
    const tokenDisplay = document.getElementById('tokenDisplay');

    async function fetchGAS(payload) {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error("Fetch Error:", error);
        throw error;
      }
    }

    // --- Speech System ---
    const chatBox = document.getElementById('chatBox');
    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');
    const statusText = document.getElementById('statusText');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micRing.classList.add('listening');
        statusText.innerText = "LISTENING PROTOCOL ACTIVE";
        statusText.classList.replace('text-info', 'text-danger');
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        addMessage(transcript, 'user');
        
        // อัปเดต Token เมื่อคุยสำเร็จ
        questionCount++;
        tokenDisplay.innerText = `COUNCIL TOKENS: ${questionCount}/${MAX_QUESTIONS}`;
        
        statusText.innerText = "PROCESSING DATA...";
        statusText.classList.replace('text-danger', 'text-warning');
        
        try {
          const res = await fetchGAS({ action: 'chat', text: transcript });
          if (res.status === 'success') {
            addMessage(res.data, 'bot');
            speakText(res.data);
          } else {
            addMessage("SYSTEM ERROR: ไม่สามารถประมวลผลคำตอบได้ครับ", 'bot');
          }
        } catch (e) {
          addMessage("CONNECTION LOST: ขาดการเชื่อมต่อกับเซิร์ฟเวอร์หลังบ้านครับ", 'bot');
        }
        statusText.innerText = "AWAITING COMMAND";
        statusText.classList.replace('text-warning', 'text-info');
      };

      recognition.onerror = () => { 
        statusText.innerText = "AUDIO SIGNAL LOST"; 
        statusText.classList.replace('text-danger', 'text-info');
        stopListening(); 
      };
      recognition.onend = () => { stopListening(); };
    }

    function toggleSpeech() {
      if (questionCount >= MAX_QUESTIONS) {
        Swal.fire({
          icon: 'warning',
          title: 'SYSTEM OVERLOAD',
          text: 'โควต้าการสนทนาด้วยเสียงของคุณครบ 10 ครั้งแล้วครับ กรุณารีเฟรชหน้าเว็บเพื่อเริ่มเซสชันใหม่',
          background: '#070f14', color: '#00d2ff', confirmButtonColor: '#00d2ff'
        });
        return;
      }
      isListening ? recognition.stop() : recognition.start();
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('listening');
      micRing.classList.remove('listening');
      if(statusText.innerText === "LISTENING PROTOCOL ACTIVE") {
        statusText.innerText = "AWAITING COMMAND";
        statusText.classList.replace('text-danger', 'text-info');
      }
    }

    function speakText(text) {
      let cleanText = text.replace(/[*#_]/g, ''); 
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'th-TH';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message msg-${sender}`;
      
      if (sender === 'user') {
        msgDiv.innerHTML = `<b style="color:var(--primary-cyan);"><i class="fa-solid fa-user-astronaut"></i> คุณ:</b><br>${text}`;
      } else {
        msgDiv.innerHTML = `<b style="color:#00ff88;"><i class="fa-solid fa-robot"></i> น้องพิธี:</b><br>${marked.parse(text)}`;
      }
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- Admin Authentication System ---
    function promptAdmin() {
      Swal.fire({
        title: 'SECURITY CLEARANCE REQUIRED',
        html: `
          <input type="text" id="swal-user" class="swal2-input bg-dark text-white border-info" placeholder="Username">
          <input type="password" id="swal-pass" class="swal2-input bg-dark text-white border-info" placeholder="Password">
        `,
        background: '#070f14', color: '#00d2ff',
        focusConfirm: false, showCancelButton: true,
        confirmButtonText: 'AUTHORIZE', confirmButtonColor: '#00d2ff',
        preConfirm: () => {
          return {
            username: document.getElementById('swal-user').value,
            password: document.getElementById('swal-pass').value
          }
        }
      }).then(async (result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'VERIFYING...', background: '#070f14', color: '#00d2ff', didOpen: () => { Swal.showLoading(); }});
          
          try {
            const res = await fetchGAS({ 
              action: 'login', 
              username: result.value.username, 
              password: result.value.password 
            });
            
            if(res.status === 'success') {
              Swal.close();
              document.getElementById('adminPanel').style.display = 'block';
              loadData();
            } else {
              Swal.fire({ icon: 'error', title: 'ACCESS DENIED', text: res.message, background: '#070f14', color: '#ff0055' });
            }
          } catch(e) {
            Swal.fire({ icon: 'error', title: 'NETWORK ERROR', text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้', background: '#070f14', color: '#ff0055' });
          }
        }
      });
    }

    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; clearForm(); }

    async function loadData() {
      document.getElementById('tbData').innerHTML = '<tr><td colspan="3" class="text-center text-info">RETRIEVING DATA...</td></tr>';
      try {
        const res = await fetchGAS({ action: 'getTrainingData' });
        let html = '';
        res.data.forEach(item => {
          html += `<tr style="border-bottom: 1px solid rgba(0, 210, 255, 0.1);">
            <td class="fw-bold text-info">${item.keywords}</td>
            <td class="text-light small">${item.answer}</td>
            <td>
              <button class="btn btn-sm btn-outline-warning" onclick="editData('${item.id}', '${item.keywords}', '${item.answer}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteData('${item.id}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
        });
        document.getElementById('tbData').innerHTML = html;
      } catch (e) {
        document.getElementById('tbData').innerHTML = '<tr><td colspan="3" class="text-danger">UPLINK FAILED</td></tr>';
      }
    }

    function editData(id, keywords, answer) {
      document.getElementById('editId').value = id;
      document.getElementById('txtKeywords').value = keywords;
      document.getElementById('txtAnswer').value = answer;
    }

    function clearForm() {
      document.getElementById('editId').value = '';
      document.getElementById('txtKeywords').value = '';
      document.getElementById('txtAnswer').value = '';
    }

    async function saveData() {
      const id = document.getElementById('editId').value;
      const keywords = document.getElementById('txtKeywords').value.trim();
      const answer = document.getElementById('txtAnswer').value.trim();

      if (!keywords || !answer) return Swal.fire({ icon: 'warning', title: 'INCOMPLETE DATA', background: '#070f14', color: '#00d2ff' });

      Swal.fire({ title: 'UPLOADING...', background: '#070f14', color: '#00d2ff', didOpen: () => { Swal.showLoading(); } });
      
      try {
        await fetchGAS({ action: 'saveTrainingData', id, keywords, answer });
        Swal.fire({ icon: 'success', title: 'DATA SAVED', text: 'อัปเดตข้อมูลสำเร็จ', background: '#070f14', color: '#00d2ff' });
        clearForm(); loadData();
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'UPLOAD FAILED', background: '#070f14', color: '#ff0055' });
      }
    }

    function deleteData(id) {
      Swal.fire({
        title: 'PURGE DATA?',
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ff0055', confirmButtonText: 'PURGE',
        background: '#070f14', color: '#00d2ff'
      }).then(async (result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'PURGING...', background: '#070f14', color: '#ff0055', didOpen: () => { Swal.showLoading(); } });
          try {
            await fetchGAS({ action: 'deleteTrainingData', id });
            Swal.fire({ icon: 'success', title: 'DATA PURGED', background: '#070f14', color: '#00d2ff' });
            loadData();
          } catch (e) { Swal.fire({ icon: 'error', title: 'FAILED', background: '#070f14', color: '#ff0055' }); }
        }
      });
    }
  </script>
</body>
</html>
